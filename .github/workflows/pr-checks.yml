name: PR Quality Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Check Kotlin formatting
        working-directory: ledger-api
        run: ./gradlew ktlintCheck || echo "ktlint not configured, skipping"

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Run unit tests
        working-directory: ledger-api
        run: ./gradlew test --tests "com.ledger.unit.*" --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ledger-api/build/reports/tests/test/

  integration-test:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Run integration tests
        working-directory: ledger-api
        run: ./gradlew test --tests "com.ledger.integration.*" --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: false
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ledger-api/build/reports/tests/test/

  security-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build for dependency check
        working-directory: ledger-api
        run: ./gradlew dependencies --no-daemon
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ledger-api
          severity: CRITICAL,HIGH
          exit-code: 1
