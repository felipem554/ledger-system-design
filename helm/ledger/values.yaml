image:
  repository: ledger-api
  tag: "latest"
  pullPolicy: IfNotPresent

# ── API deployment ────────────────────────────────────────────────────────
api:
  replicaCount: 3
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 2

# ── Worker deployment ─────────────────────────────────────────────────────
worker:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
      - type: Pods
        pods:
          metric:
            name: kafka_consumer_lag
          target:
            type: AverageValue
            averageValue: "1000"
  pdb:
    enabled: true
    minAvailable: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ledger.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  LOG_LEVEL: INFO
  KAFKA_BOOTSTRAP: "kafka:9092"
  POSTGRES_URL: "jdbc:postgresql://postgres:5432/ledger"
  POSTGRES_USER: "ledger"
  POSTGRES_PASSWORD: "ledger"
  MONGO_URI: "mongodb://mongo:27017/ledger"

networkPolicy:
  enabled: false
