server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ledger-api
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${POSTGRES_USER:ledger}
    password: ${POSTGRES_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/ledger}
      auto-index-creation: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
        batch.size: 65536
        compression.type: snappy
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    consumer:
      group-id: ledger-projection-mongo-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
        max.poll.records: 500
        fetch.min.bytes: 1048576
        fetch.max.wait.ms: 250
        max.partition.fetch.bytes: 1048576
        session.timeout.ms: 15000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 300000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    tags:
      application: ledger-api
  endpoint:
    health:
      show-details: always

ledger:
  mode: ${LEDGER_MODE:all}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_MS:200}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  kafka:
    topic:
      transactions: ledger.transactions.v1
      dlq: ledger.outbox.dlq.v1
    partition-buckets: 128

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ledger: DEBUG
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","logger":"%logger{36}","message":"%m","traceId":"%X{traceId}","tenantId":"%X{tenantId}","txId":"%X{txId}"}%n'
